# NutCheck sweep: test every mint in scorecard.json, keep the reports on the `data` branch,
# publish the scorecard to GitHub Pages, and fail loudly (GitHub emails you) when a serious
# failure needs reporting to a mint operator before its details go public.
# Free checks every 6 hours; funded checks (real sats, from the NWC wallet) once a day.
name: Scorecard

on:
  schedule:
    - cron: "17 5 * * *"          # 05:17 UTC: funded run (off the hour; GitHub delays top-of-hour runs)
    - cron: "17 11,17,23 * * *"   # every 6 hours in between: free checks only
  workflow_dispatch:
    inputs:
      funded:
        description: 'Fund the "nwc" mints from the NWC wallet now (the scheduled 05:17 UTC run does this daily)'
        type: boolean
        default: false
      only:
        description: "Test only this mint, by slug (e.g. mint.minibits.cash_bitcoin). Empty = all"
        type: string
        default: ""

permissions:
  contents: write   # push reports to the data branch
  pages: write
  id-token: write

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      alerts: ${{ steps.alerts.outputs.text }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NutCheck
        run: pip install ".[nwc]"

      - name: Check out report history (data branch)
        run: |
          git config --global user.name "nutcheck-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git worktree add data FETCH_HEAD
          else
            git worktree add --orphan -b data data
          fi

      - name: Test every mint
        env:
          NWC_URL: ${{ secrets.NWC_URL }}   # only this step can see the wallet connection
          FUNDED_INPUT: ${{ inputs.funded }}
          ONLY: ${{ inputs.only }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          args=()
          if [ "$FUNDED_INPUT" = "true" ] || [ "$SCHEDULE" = "17 5 * * *" ]; then
            if [ -n "$NWC_URL" ]; then
              args+=(--nwc --funding-alerts funding-alerts.txt)
            else
              echo "::warning::NWC_URL secret is not set; funded checks skipped"
            fi
          fi
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          nutcheck sweep scorecard.json "${args[@]}"

      - name: Save reports
        run: |
          cd data
          git add -A reports
          if [ -d stash ] || git ls-files --error-unmatch stash >/dev/null 2>&1; then git add -A stash; fi
          if ! git diff --cached --quiet; then
            git commit -q -m "Sweep $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:data
          fi

      - name: Build site
        run: nutcheck site scorecard.json -o _site --alerts alerts.txt

      # Signed NIP-87 reviews (kind 38000), one per mint, so wallets can read grades without trusting
      # this website. Only changed reviews are re-sent. Never blocks the site: relays come and go.
      - name: Publish grades on Nostr
        continue-on-error: true
        env:
          NOSTR_SECRET_KEY: ${{ secrets.NOSTR_SECRET_KEY }}
        run: |
          if [ -z "$NOSTR_SECRET_KEY" ]; then echo "No NOSTR_SECRET_KEY secret yet: not publishing"; exit 0; fi
          nutcheck nostr publish scorecard.json

      - id: alerts
        name: Collect disclosure alerts
        run: |
          {
            echo 'text<<NUTCHECK_EOF'
            cat alerts.txt funding-alerts.txt 2>/dev/null
            echo 'NUTCHECK_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3   # v3 keeps dot-folders (.well-known/nostr.json); v4 drops them
        with:
          path: _site

  deploy:
    needs: sweep
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  alert:
    needs: [sweep, deploy]
    if: needs.sweep.outputs.alerts != ''
    runs-on: ubuntu-latest
    steps:
      - name: NutCheck needs your attention
        env:
          ALERTS: ${{ needs.sweep.outputs.alerts }}
        run: |
          echo "::error::NutCheck found something that needs a person:"
          printf '%s\n' "$ALERTS"
          echo
          echo "Serious mint failure: details are withheld from the site until the date shown. Contact the operator"
          echo "privately, then add  \"notified\": \"<date>\"  to that mint in scorecard.json and push."
          echo "Funding problem: no further mints were funded in this run. Check the NWC wallet's balance and history."
          exit 1
